    <div class="container my-5 py-5">
      <div class="d-flex mx-auto mt-5 justify-content-center">
        <div class="col-lg-8 col-sm-12 col-md-11 flex-wrap row preasidium justify-content-center">
          <div class="col-md-4 col-sm-6 col-8 mt-2 position-relative flex-wrap"
               [attr.data-aos]="'fade-up'"
               [attr.data-aos-delay]="calculateAOSDelay(i)"

               *ngFor="let person of persons; let i = index">
            <img [src]="person.staticImg" (mouseover)="toggleImages(i)" (click)="openModal(i)"
                 [style.display]="person.showImg ? 'block' : 'none'" class="preasidium-person-img">
            <img [src]="person.animatedImg" (mouseout)="toggleImages(i)" (click)="openModal(i)"
                 [style.display]="person.showImg? 'none' : 'block'" class="preasidium-person-img">
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-footer class="position-relative"></app-footer>
</div>
<app-preasidium-person-modal
  class="col-xl-4 col-lg-6 col-md-8 person-modal m-4"
  [ngClass]="{'transition-modal-open': !isModalOpen, 'transition-modal-closed': isModalOpen}"
  [person]="modalPerson"
  (closeModalEvent)="closeModal()">
</app-preasidium-person-modal>
